<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mührü Bir Kez Oy — WebGL2 Instanced Particles</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f1020;
        color: #e5e7eb;
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(15, 16, 32, 0.82);
        border: 1px solid #312e81;
        border-radius: 8px;
        padding: 10px 12px;
        min-width: 250px;
      }
      #ui h1 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        color: #a78bfa;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      button {
        flex: 1;
        cursor: pointer;
        background: #1e1b4b;
        color: #e5e7eb;
        border: 1px solid #4338ca;
        border-radius: 5px;
        padding: 5px 8px;
        font: inherit;
      }
      button:hover {
        background: #312e81;
      }
      button.active {
        background: #7c3aed;
        border-color: #a78bfa;
      }
      #hud {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 1px 10px;
      }
      #hud b {
        font-weight: 600;
        color: #34d399;
      }
      .dim {
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <h1>Instanced Particles</h1>
      <div class="row" id="counts">
        <button data-count="10000">10.000</button>
        <button data-count="50000">50.000</button>
        <button data-count="200000">200.000</button>
      </div>
      <div class="row" id="modes">
        <button data-mode="instanced">instancing</button>
        <button data-mode="batched">batching</button>
      </div>
      <div id="hud">
        <span class="dim">yol</span><b id="v-mode">—</b>
        <span class="dim">parçacık</span><b id="v-count">—</b>
        <span class="dim">FPS</span><b id="v-fps">—</b>
        <span class="dim">kare süresi</span><b id="v-ms">—</b>
        <span class="dim">draw call</span><b id="v-calls">—</b>
        <span class="dim">kare başına</span><b id="v-bytes">—</b>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
